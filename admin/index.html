<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#15705D">
<title>Admin · Tes Calon Pengasuh</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&display=swap">
<style>
/* Admin dashboard (web). 6-digit PIN checked on the server; answer keys load from the database after sign-in. */
:root{
  --bg:#EEF4F2; --surface:#FFFFFF; --sunk:#E4ECE9; --ink:#132B27; --muted:#556964; --line:#D0DDD9;
  --accent:#15705D; --accent-ink:#FFFFFF; --accent-soft:#D5ECE5;
  --good:#1C8748; --good-soft:#DBF1E3; --warn:#9A6210; --warn-soft:#F6EAD0; --bad:#BD3A2A; --bad-soft:#F8DFDA;
  --dD:#C8483A; --dI:#C98F12; --dS:#2B8D5C; --dC:#3667B3;
  --shadow:0 1px 2px rgb(19 43 39 / .05), 0 4px 14px rgb(19 43 39 / .05);
  --font:'Lexend', ui-rounded, 'Segoe UI', system-ui, sans-serif;
  --r:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1715; --surface:#14211D; --sunk:#1B2A26; --ink:#E3EEEA; --muted:#9AB0AA; --line:#283A35;
  --accent:#4DC1A5; --accent-ink:#06201A; --accent-soft:#163A31;
  --good:#4CC27F; --good-soft:#163724; --warn:#E3AC50; --warn-soft:#382B13; --bad:#F07A6A; --bad-soft:#3D1E19;
  --dD:#E86F61; --dI:#E6B445; --dS:#55BF8A; --dC:#6F9BE2; --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1715; --surface:#14211D; --sunk:#1B2A26; --ink:#E3EEEA; --muted:#9AB0AA; --line:#283A35;
  --accent:#4DC1A5; --accent-ink:#06201A; --accent-soft:#163A31;
  --good:#4CC27F; --good-soft:#163724; --warn:#E3AC50; --warn-soft:#382B13; --bad:#F07A6A; --bad-soft:#3D1E19;
  --dD:#E86F61; --dI:#E6B445; --dS:#55BF8A; --dC:#6F9BE2; --shadow:none; color-scheme:dark}

*{box-sizing:border-box}
body{margin:0;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top, 0px);z-index:10;background:var(--bg)}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:16px 56px;display:flex;flex-direction:column;gap:16px}
.wrap.wide{max-width:960px}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.25}
h1{font-size:1.55rem;font-weight:600}
h2{font-size:1.12rem;font-weight:600}
h3{font-size:.98rem;font-weight:600}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.eyebrow{font-size:.72rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.nowrap{flex-wrap:nowrap;flex:none}
.spread{display:flex;justify-content:space-between;align-items:center;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0;box-shadow:var(--shadow)}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.note{font-size:.8rem;color:var(--muted);line-height:1.5}
.num{font-variant-numeric:tabular-nums}

button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,a:focus-visible,summary:focus-visible,[role="button"]:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:12px 18px;font-weight:600;font-size:.98rem;background:var(--accent);color:var(--accent-ink);min-height:48px;text-decoration:none}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:var(--bad);color:#fff}
.btn.block{width:100%}
.link{background:none;border:0;padding:4px 0;color:var(--accent);font-weight:500;align-self:flex-start;text-align:left;text-decoration:none}
.icon-btn{display:inline-flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-weight:500;font-size:.86rem}
.icon-btn svg{width:16px;height:16px}

/* Top */
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:10px;font-weight:600}
.brand small{display:block;font-weight:400;font-size:.75rem;color:var(--muted)}
.mark{width:36px;height:36px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:700;font-size:.82rem;flex:none}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:4px;background:var(--sunk);border-radius:12px}
.tab{border:0;background:transparent;border-radius:9px;padding:9px 6px;font-weight:600;font-size:.9rem;color:var(--muted)}
.tab.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0 / .08)}

/* Chips, banners */
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:.78rem;font-weight:600;white-space:nowrap}
.chip.good{background:var(--good-soft);color:var(--good)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.neutral{background:var(--sunk);color:var(--muted)}
.banner{padding:12px 14px;border-radius:12px;font-size:.9rem;font-weight:500}
.banner.good{background:var(--good-soft);color:var(--good)} .banner.warn{background:var(--warn-soft);color:var(--warn)} .banner.bad{background:var(--bad-soft);color:var(--bad)}
.dotc{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block}
.dotc.good{background:var(--good)} .dotc.warn{background:var(--warn)} .dotc.bad{background:var(--bad)} .dotc.neutral{background:var(--muted)}

/* PIN */
.dots{display:flex;gap:14px;justify-content:center;padding:6px 0}
.dots .d{width:16px;height:16px;border-radius:50%;border:2px solid var(--muted)}
.dots .d.on{background:var(--ink);border-color:var(--ink)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:300px;margin:0 auto;width:100%}
.pad button{height:58px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-size:1.35rem;font-weight:500}
.pad button.fn{font-size:.85rem;background:transparent;border-color:transparent;color:var(--muted)}
.err{color:var(--bad);font-weight:500;text-align:center;min-height:1.4em;font-size:.9rem}

/* Forms */
label{display:flex;flex-direction:column;gap:6px;font-weight:500;font-size:.92rem}
input,textarea,select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 14px;width:100%;min-height:46px}
textarea{min-height:110px;resize:vertical}

/* Results list */
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tile{display:flex;flex-direction:column;gap:2px;text-align:left;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);min-width:0}
.tile .tl{display:flex;align-items:center;gap:6px;font-size:.74rem;color:var(--muted)}
.tile b{font-size:1.45rem;font-weight:600;font-variant-numeric:tabular-nums}
.tile.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.search{color:var(--muted);font-size:.8rem}
.controls label{color:var(--muted);font-size:.8rem}
.rlist{display:grid;gap:12px}
.rc{display:flex;flex-direction:column;gap:14px;padding:16px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);cursor:pointer;min-width:0;box-shadow:var(--shadow);transition:border-color .12s}
.rc:hover{border-color:var(--accent)}
.rc-top{display:flex;gap:12px;align-items:center}
.rc-top .who{flex:1;min-width:0;display:flex;flex-direction:column}
.rc-top .who b{font-size:1.05rem;font-weight:600;overflow-wrap:anywhere}
.rc-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.st{display:flex;flex-direction:column;min-width:0;padding:8px 10px;border-radius:10px;background:var(--sunk)}
.st b{font-size:1rem;font-weight:600;font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:6px}
.st span{font-size:.7rem;color:var(--muted);line-height:1.3}
.rc-foot{display:flex;justify-content:space-between;align-items:center;gap:10px}
.cmpbtn{border:1px solid var(--line);background:transparent;border-radius:999px;padding:6px 12px;font-size:.8rem;font-weight:500}
.cmpbtn.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.cmpbar{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--surface);border-top:1px solid var(--line);padding-top:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom, 0px));padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.cmpbar .inner{max-width:960px;margin:0 auto;display:flex;align-items:center;gap:10px}
.cmpbar .inner span{flex:1}
.empty{display:flex;flex-direction:column;gap:12px;align-items:flex-start}

/* Score ring */
.ring{position:relative;flex:none;display:grid;place-items:center}
.ring svg{display:block;transform:rotate(-90deg)}
.ring b{position:absolute;font-weight:700;font-variant-numeric:tabular-nums}
.ring .track{stroke:var(--sunk)}

/* Result detail */
.hero{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
.hero .v{font-size:1.3rem;font-weight:700}
.hero .v.good{color:var(--good)} .hero .v.warn{color:var(--warn)} .hero .v.bad{color:var(--bad)}
.reasons{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.reasons li{display:flex;gap:10px;align-items:baseline;font-size:.92rem}
.reasons .dotc{transform:translateY(-1px)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 13px;font-size:.85rem;font-weight:500}
.seg button.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.meter{display:flex;flex-direction:column;gap:6px}
.meter .t{height:10px;background:var(--sunk);border-radius:99px;overflow:hidden;position:relative}
.meter .t span{display:block;height:100%;border-radius:99px}
.meter .t.marks::before,.meter .t.marks::after{content:"";position:absolute;top:0;bottom:0;width:2px;background:var(--surface);z-index:1}
.meter .t.marks::before{left:45%} .meter .t.marks::after{left:70%}
.scale-row{display:flex;flex-direction:column;gap:6px;padding-block:4px}
.scale-row + .scale-row{border-top:1px solid var(--line);padding-top:12px}
.dbar{display:grid;grid-template-columns:20px 1fr 36px;gap:10px;align-items:center}
.dbar .dl{font-weight:700}
.dbar .dv{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.track2{position:relative;height:12px;background:var(--sunk);border-radius:99px}
.track2 .mid{position:absolute;left:50%;top:-3px;bottom:-3px;width:2px;background:var(--line)}
.track2 .fill{position:absolute;top:0;bottom:0;border-radius:99px}
.scale-legend{display:grid;grid-template-columns:20px 1fr 36px;gap:10px;font-size:.7rem;color:var(--muted)}
.scale-legend div{display:flex;justify-content:space-between}
ul.plain,ol.plain{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px}
.cols{display:grid;grid-template-columns:1fr;gap:14px}
.ans{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:6px}
.ans:first-child{border-top:0;padding-top:0}
.ans .q{font-size:.84rem;color:var(--muted)}
.ans .a{font-weight:500}
.probe{font-size:.86rem;background:var(--sunk);padding:10px 12px;border-radius:10px}
.flag{color:var(--bad);font-weight:600;font-size:.86rem}
details.more summary{cursor:pointer;font-weight:600;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:10px}
details.more summary::-webkit-details-marker{display:none}
details.more summary::after{content:"+";font-size:1.3rem;font-weight:400;color:var(--muted)}
details.more[open] summary::after{content:"−"}
.kv{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:8px 14px;font-size:.9rem}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-weight:500}
.confirm{display:flex;flex-direction:column;gap:10px;padding:14px;border:1px solid var(--bad);border-radius:12px}

/* Compare */
.ctable{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.ctable table{border-collapse:collapse;width:100%;min-width:560px}
.ctable th,.ctable td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;font-size:.88rem;font-variant-numeric:tabular-nums}
.ctable tbody th{font-weight:500;color:var(--muted);width:150px;position:sticky;left:0;background:var(--surface);z-index:1}
.ctable thead th{font-weight:600;font-size:.95rem}
.ctable tr.sec th{background:var(--sunk);color:var(--ink);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase}
.ctable td.best{font-weight:700;color:var(--good)}
.ctable tr:last-child th,.ctable tr:last-child td{border-bottom:0}

/* Method page */
.method h2{font-size:1.05rem}
.method p,.method li{font-size:.92rem}
.wtable{display:grid;grid-template-columns:1fr auto;gap:8px 14px;font-size:.9rem}
.wtable b{font-variant-numeric:tabular-nums}

@media (min-width:760px){
  .wide .rlist{grid-template-columns:1fr 1fr}
  .cols.two{grid-template-columns:1fr 1fr}
}
@media (max-width:440px){
  .tiles{grid-template-columns:1fr 1fr}
  .rc-stats{grid-template-columns:1fr 1fr}
  .hero{grid-template-columns:1fr;justify-items:start}
  .kv{grid-template-columns:1fr}
  .kv dd{margin-bottom:6px}
}
/* Sign-in */
.otp{font-size:1.6rem;letter-spacing:.5em;text-align:center;font-variant-numeric:tabular-nums;padding-left:.5em}
.login-actions{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="wrap" id="app">
  <div class="top"><div class="brand"><span class="mark">TP</span><div>Tes Calon Pengasuh<small>Admin</small></div></div></div>
  <div class="card"><p class="muted">Memuat…</p></div>
</div>

<script>
const BIO = [{"id":"exp","q":"Sudah berapa lama kamu kerja jadi pengasuh anak?","o":["Belum pernah","Kurang dari 1 tahun","1 sampai 3 tahun","Lebih dari 3 tahun"]},{"id":"baby","q":"Pernah mengasuh anak di bawah umur 2 tahun?","o":["Belum pernah","Pernah, sebentar saja","Pernah, lebih dari 6 bulan"]},{"id":"last","q":"Berapa lama kamu kerja di tempat terakhir?","o":["Belum pernah kerja","Kurang dari 6 bulan","6 bulan sampai 1 tahun","Lebih dari 1 tahun"]},{"id":"why","q":"Kenapa kamu berhenti dari tempat kerja terakhir?","o":["Belum pernah kerja","Kontrak atau kerjaan sudah selesai","Ada masalah dengan majikan","Urusan keluarga","Gaji kurang","Alasan lain"]},{"id":"plan","q":"Kalau diterima, kamu mau kerja di sini berapa lama?","o":["Kurang dari 1 tahun","1 sampai 2 tahun","Lebih dari 2 tahun","Belum tahu"]},{"id":"smoke","q":"Apakah kamu merokok?","o":["Tidak","Ya, kadang-kadang","Ya, setiap hari"]}];
const LIKERT_SCALE = ["Sangat tidak cocok","Tidak cocok","Ragu-ragu","Cocok","Sangat cocok"];
const DISC = [{"q":"","o":{"D":"Saya suka kerja cepat, supaya cepat selesai.","I":"Saya senang ngobrol dengan orang di rumah.","S":"Saya suka kerjaan yang sama setiap hari.","C":"Saya suka barang ada di tempatnya."}},{"q":"Kalau ada masalah di rumah…","o":{"D":"Saya langsung cari jalan keluar sendiri.","I":"Saya cerita ke orang lain supaya dibantu.","S":"Saya tenang dulu, tidak buru-buru.","C":"Saya pikir dulu baik-baik, baru bertindak."}},{"q":"Teman bilang saya orangnya…","o":{"D":"Berani.","I":"Lucu dan ramai.","S":"Sabar.","C":"Teliti."}},{"q":"Kalau disuruh dengan cara yang menurut saya kurang bagus…","o":{"D":"Saya bilang cara saya lebih cepat.","I":"Saya ajak ngobrol baik-baik.","S":"Saya ikuti saja. Tidak enak kalau membantah.","C":"Saya tanya alasannya, supaya paham."}},{"q":"Waktu kerja, saya paling senang kalau…","o":{"D":"Kerjaan selesai lebih cepat dari waktunya.","I":"Suasana rumah ramai dan ceria.","S":"Semua orang di rumah akur dan tenang.","C":"Semua kerjaan rapi dan tidak ada yang salah."}},{"q":"","o":{"D":"Saya tidak suka menunggu lama.","I":"Saya gampang akrab dengan orang baru.","S":"Saya perlu waktu untuk biasa di tempat baru.","C":"Saya suka ada daftar kerjaan yang jelas."}},{"q":"Kalau saya sedang capek…","o":{"D":"Saya tetap paksa sampai selesai.","I":"Saya cari teman ngobrol supaya semangat lagi.","S":"Saya diam dan tetap kerja pelan-pelan.","C":"Saya atur lagi, mana yang harus duluan."}},{"q":"Saya paling tidak suka kalau…","o":{"D":"Disuruh terus, tidak boleh pakai cara sendiri.","I":"Kerja sendirian, tidak ada teman bicara.","S":"Aturan rumah sering berubah-ubah.","C":"Kerjaan dibuat asal-asalan."}},{"q":"Kalau main dengan anak kecil…","o":{"D":"Saya ajak main yang aktif, seperti kejar-kejaran.","I":"Saya nyanyi dan bikin dia ketawa.","S":"Saya temani dia main apa saja yang dia mau.","C":"Saya ajari dia hal baru, seperti warna atau angka."}},{"q":"Kalau ada aturan baru di rumah…","o":{"D":"Saya coba dulu. Kalau tidak cocok, saya bilang. let SCEN = SCEN_TXT, LIK = LIK_TXT, BIO_NOTES = {};
/* The admin page ships question texts only. After sign-in it loads the answer keys
   (stored in Supabase, readable by admins only) and rebuilds the full content objects
   in exactly the shape content.js defines, so scoring.js runs unchanged. */

// content.js objects -> secret part stored in tes_pengasuh_config (used by build.js)
function splitKeys(SCEN_FULL, LIK_FULL, BIO_NOTES_FULL){
  return {
    v: 2,
    scen: SCEN_FULL.map(s => ({dim: s.dim, probe: s.probe, o: s.o.map(o => o.slice(1))})),
    lik: LIK_FULL.map(l => { const x = {k: l.k}; if(l.r) x.r = l.r; if(l.want != null) x.want = l.want; if(l.pair != null) x.pair = l.pair; return x; }),
    bioNotes: BIO_NOTES_FULL,
  };
}

// public texts + keys -> full objects
function hydrate(scenTxt, likTxt, cfg){
  if(!cfg || cfg.v !== 2 || cfg.scen?.length !== scenTxt.length || cfg.lik?.length !== likTxt.length) throw new Error("config mismatch");
  return {
    SCEN: scenTxt.map((s, i) => ({dim: cfg.scen[i].dim, t: s.t, o: s.o.map((txt, k) => [txt, ...cfg.scen[i].o[k]]), probe: cfg.scen[i].probe})),
    LIK: likTxt.map((l, i) => ({t: l.t, ...cfg.lik[i]})),
    BIO_NOTES: cfg.bioNotes || {},
  };
}


/* Shared by both pages: helpers, DISC block order and the answer code that travels
   from the candidate page to the admin dashboard inside a link. */

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const LS = {
  get(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch{ return null; } },
  set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch{} },
  del(k){ try{ localStorage.removeItem(k); }catch{} },
};

// Fixed per-block shuffle so the same letter is not always in the same spot.
function order(i){
  const a = ["D","I","S","C"]; let s = (i+1)*7919;
  for(let k=3;k>0;k--){ s = (s*9301+49297)%233280; const j = Math.floor(s/233280*(k+1)); [a[k],a[j]]=[a[j],a[k]]; }
  return a;
}

// One DISC answer (most, least) = one letter a-l.
const PAIR = "abcdefghijkl", DL = "DISC";
function encPair(m, l){ const mi = DL.indexOf(m), li = DL.indexOf(l); return PAIR[mi*3 + (li > mi ? li-1 : li)]; }
function decPair(ch){
  const x = PAIR.indexOf(ch); if(x < 0) return null;
  const mi = Math.floor(x/3), lj = x%3, li = lj >= mi ? lj+1 : lj;
  return {m:DL[mi], l:DL[li]};
}

const clean = s => (String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").trim().replace(/\s+/g,"_").replace(/[^A-Za-z0-9_]/g,"").slice(0,30)) || "~";
const unclean = s => s === "~" ? "" : String(s||"").replace(/_/g," ");
function checksum(s){ let h=0; for(const ch of s){ h = (h*31 + ch.charCodeAt(0)) >>> 0; } return (h % 1296).toString(36).padStart(2,"0"); }
const s36 = n => Math.max(0, Math.round(n||0)).toString(36);

// Indonesian mobile number as typed -> "08xxxxxxxxxx", or "" when it does not look like one.
function cleanPhone(v){
  let d = String(v || "").replace(/\D/g, "");
  if(d.startsWith("62")) d = "0" + d.slice(2); else if(d.startsWith("8")) d = "0" + d;
  return /^08\d{8,12}$/.test(d) ? d : "";
}

// tp3.<id>.<name>.<age>.<origin>.<phone>.<bio><scen><likert><disc>.<sjt s>.<likert s>.<disc s>.<total s>.<finished s>.<check>
// (tp2 = the same without <phone>; tp1 = the first test version)
function buildCode(c){
  const ans = c.bio.join("") + c.scen.join("") + c.lik.join("") + c.disc.map(a => encPair(a.m, a.l)).join("");
  const body = ["tp3", c.id, clean(c.name), clean(c.age), clean(c.origin), cleanPhone(c.phone) || "~", ans,
    s36(c.dur.sjt), s36(c.dur.lik), s36(c.dur.disc), s36((c.finishedAt - c.startedAt)/1000), s36(c.finishedAt/1000)].join(".");
  return body + "." + checksum(body);
}

// Returns a stored record, or null when the code is damaged. Reads every version.
function decodeCode(raw){
  try{
    const m = String(raw||"").match(/tp[123]\.[A-Za-z0-9._~-]+/); if(!m) return null;
    const parts = m[0].split(".");
    const v = +parts[0].slice(2);
    const n = {1:10, 2:12, 3:13}[v];
    if(parts.length !== n) return null;
    if(checksum(parts.slice(0, n-1).join(".")) !== parts[n-1]) return null;
    const [, id, name, age, origin] = parts;
    const num = i => parseInt(parts[i], 36);
    const discFrom = str => [...str].map(ch => { const p = decPair(ch); if(!p) throw new Error("bad"); return p; });
    const base = {id:"w"+id, name:unclean(name), age:unclean(age), origin:unclean(origin), phone:"", notes:"", status:"Baru", source:"online"};

    if(v === 1){
      const ans = parts[5];
      if(ans.length !== DISC.length + 10) return null;
      const disc = discFrom(ans.slice(0, DISC.length));
      const scen = [...ans.slice(DISC.length)].map(Number);
      if(scen.some(x => !(x >= 0 && x <= 3))) return null;
      const finishedAt = num(8)*1000, startedAt = finishedAt - num(7)*1000, discS = num(6);
      return {...base, v:1, bio:null, lik:null, disc, scen, startedAt, finishedAt, createdAt:finishedAt,
        dur:{disc:discS, sjt:Math.max(0, (finishedAt-startedAt)/1000 - discS), lik:0}};
    }

    // tp3 has one extra field (phone) before the answers.
    const k = v === 3 ? 6 : 5, ans = parts[k];
    const phone = v === 3 ? cleanPhone(unclean(parts[5])) : "";
    const nb = BIO.length, ns = SCEN.length, nl = LIK.length;
    if(ans.length !== nb + ns + nl + DISC.length) return null;
    const digits = s => [...s].map(Number);
    const bio = digits(ans.slice(0, nb));
    const scen = digits(ans.slice(nb, nb+ns));
    const lik = digits(ans.slice(nb+ns, nb+ns+nl));
    const disc = discFrom(ans.slice(nb+ns+nl));
    if(bio.some((x,i) => !(x >= 0 && x < BIO[i].o.length))) return null;
    if(scen.some(x => !(x >= 0 && x <= 3))) return null;
    if(lik.some(x => !(x >= 1 && x <= 5))) return null;
    const finishedAt = num(k+5)*1000, startedAt = finishedAt - num(k+4)*1000;
    return {...base, phone, v:2, bio, scen, lik, disc, startedAt, finishedAt, createdAt:finishedAt,
      dur:{sjt:num(k+1), lik:num(k+2), disc:num(k+3)}};
  }catch{ return null; }
}

/* Scoring for the admin dashboard only (never shipped to the candidate page).

   Method, in order of how much it counts:
   1. Situational judgment (SJT): 12 childcare situations, keyed 0-3 by childcare safety
      guidance. The strongest job-related signal here, so it carries 40% of the overall score.
   2. Character scales: 4 job-relevant traits x 6 items (3 positive, 3 reverse-keyed) from
      IPIP / HEXACO-style items. Each scale = mean of 1-5 answers, rescaled to 0-100. 15% each.
   3. Response quality checks: too-good-to-be-true items, an instructed-response item,
      4 repeated-meaning pairs, same-answer runs, answer speed and DISC position bias.
   4. DISC: work style only. Not part of the score; DISC is not validated for selection. */

const BAND = s => s >= 70 ? {k:"hi", t:"Tinggi", cls:"good"} : s >= 45 ? {k:"mid", t:"Sedang", cls:"warn"} : {k:"lo", t:"Rendah", cls:"bad"};
const WEIGHTS = {sjt:.40, H:.15, C:.15, E:.15, A:.15};

function scoreDisc(disc){
  const d = {D:0,I:0,S:0,C:0}, pos = [0,0,0,0];
  (disc||[]).forEach((a, i) => {
    if(!a || !a.m || !a.l) return;
    d[a.m]++; d[a.l]--;
    pos[order(i).indexOf(a.m)]++;
  });
  const ranked = Object.entries(d).sort((a,b) => b[1]-a[1]);
  const primary = ranked[0][0], secondary = ranked[1][1] > 0 ? ranked[1][0] : null;
  const fitPts = d.S*1 + d.C*0.6 + d.I*0.3 - d.D*0.7;
  const fit = fitPts >= 6 ? {t:"Cocok", cls:"good"} : fitPts >= 0 ? {t:"Cukup cocok", cls:"warn"} : {t:"Perlu diperhatikan", cls:"bad"};
  return {d, pos, primary, secondary, fitPts, fit};
}

function scoreSjt(scen){
  const dims = {}; Object.keys(DIMS).forEach(k => dims[k] = {got:0, of:0});
  const flags = [], answers = []; let total = 0, max = 0;
  SCEN.forEach((sc, i) => {
    const k = scen?.[i]; if(k == null || !sc.o[k]) return;
    const [txt, pts, flag, sev] = sc.o[k];
    total += pts; max += 3; dims[sc.dim].got += pts; dims[sc.dim].of += 3;
    if(flag) flags.push({t:flag, sev:sev||"sedang", i});
    answers.push({i, txt, pts, flag, sev});
  });
  Object.values(dims).forEach(x => x.pct = x.of ? Math.round(x.got/x.of*100) : null);
  return {pct: max ? Math.round(total/max*100) : 0, n: answers.length, dims, flags, answers};
}

function scoreLikert(lik){
  if(!Array.isArray(lik) || lik.length !== LIK.length) return null;
  const sums = {}, counts = {};
  Object.keys(SCALES).forEach(k => { sums[k] = 0; counts[k] = 0; });
  let lie = 0, attentionOk = true; const pairs = [], strong = [];
  LIK.forEach((it, i) => {
    const v = lik[i];
    if(SCALES[it.k]){
      const val = it.r ? 6 - v : v;
      sums[it.k] += val; counts[it.k]++;
      if(val <= 2) strong.push({i, v, k:it.k});
    }
    else if(it.k === "L" && v >= 4) lie++;
    else if(it.k === "X" && v !== it.want) attentionOk = false;
    else if(it.k === "P") pairs.push({a:it.pair, b:i, diff:Math.abs(v - lik[it.pair])});
  });
  const scales = {};
  Object.keys(SCALES).forEach(k => { const s = Math.round((sums[k]/counts[k] - 1)/4*100); scales[k] = {score:s, band:BAND(s)}; });
  const freq = [0,0,0,0,0,0];
  LIK.forEach((it, i) => { if(it.k !== "X") freq[lik[i]]++; });
  const sameMax = Math.max(...freq), scored = LIK.filter(it => it.k !== "X").length;
  return {scales, lie, lieOf:LIK.filter(it => it.k === "L").length, attentionOk,
    inconsistent: pairs.filter(p => p.diff >= 3), pairs, sameMax, scored, strong};
}

function checkQuality(c, disc, lk){
  const issues = []; // {t, level:"major"|"minor"}
  const dur = c.dur || {disc:((c.part2At||0) - (c.startedAt||0))/1000, sjt:((c.finishedAt||0) - (c.part2At||0))/1000, lik:0};
  if(lk){
    if(!lk.attentionOk) issues.push({level:"major", t:"Soal cek (\"Tekan Tidak cocok\") dijawab salah. Kemungkinan tidak membaca soal, atau kurang paham."});
    if(lk.lie >= 3) issues.push({level:"major", t:`${lk.lie} dari ${lk.lieOf} pernyataan \"terlalu sempurna\" dijawab cocok (contoh: tidak pernah bohong sekali pun). Kemungkinan menjawab supaya terlihat baik, jadi skor karakter bisa lebih tinggi dari aslinya.`});
    else if(lk.lie === 2) issues.push({level:"minor", t:`2 dari ${lk.lieOf} pernyataan \"terlalu sempurna\" dijawab cocok. Ada kecenderungan ingin terlihat baik.`});
    if(lk.inconsistent.length >= 2) issues.push({level:"major", t:`${lk.inconsistent.length} dari ${lk.pairs.length} pasang soal yang artinya sama dijawab bertolak belakang. Jawaban tidak konsisten.`});
    else if(lk.inconsistent.length === 1) issues.push({level:"minor", t:"1 pasang soal yang artinya sama dijawab bertolak belakang."});
    if(lk.sameMax >= Math.ceil(lk.scored*0.75)) issues.push({level:"major", t:`${lk.sameMax} dari ${lk.scored} soal karakter dijawab dengan pilihan yang sama. Kemungkinan asal pilih.`});
    if(dur.lik > 0 && dur.lik < LIK.length*2) issues.push({level:"minor", t:`Bagian karakter selesai dalam ${fmtSec(dur.lik)}. Terlalu cepat untuk membaca ${LIK.length} soal.`});
  }
  if(dur.sjt > 0 && dur.sjt < SCEN.length*4) issues.push({level:"minor", t:`Bagian cerita selesai dalam ${fmtSec(dur.sjt)}. Terlalu cepat untuk membaca semua cerita.`});
  if(dur.disc > 0 && dur.disc < (c.v === 2 ? 120 : 180)) issues.push({level:"minor", t:`Bagian gaya kerja selesai dalam ${fmtSec(dur.disc)}. Terlalu cepat untuk membaca 80 kalimat.`});
  const maxPos = Math.max(...disc.pos);
  if(maxPos >= 11) issues.push({level:"minor", t:`Jawaban \"paling mirip\" ${maxPos} dari 20 kali ada di urutan yang sama. Kemungkinan asal pilih di bagian gaya kerja.`});
  const majors = issues.filter(x => x.level === "major").length, minors = issues.length - majors;
  const level = majors >= 2 ? {t:"Rendah", cls:"bad"} : (majors === 1 || minors >= 2) ? {t:"Perlu dicek", cls:"warn"} : {t:"Baik", cls:"good"};
  return {issues, level, dur};
}

function fmtSec(s){ s = Math.round(s||0); if(s < 60) return s + " detik"; const m = Math.round(s/60); return m + " menit"; }

function compute(c){
  const disc = scoreDisc(c.disc);
  const sjt = scoreSjt(c.scen);
  const lk = scoreLikert(c.lik);
  const quality = checkQuality(c, disc, lk);

  // Overall score: SJT-weighted when character scales exist, SJT only for first-version tests.
  let overall = sjt.pct;
  if(lk){
    overall = sjt.pct*WEIGHTS.sjt + Object.keys(SCALES).reduce((s,k) => s + lk.scales[k].score*WEIGHTS[k], 0);
  }
  overall = Math.round(overall);

  const severe = sjt.flags.filter(f => f.sev === "berat");
  const lowScales = lk ? Object.keys(SCALES).filter(k => lk.scales[k].band.k === "lo") : [];
  const reasons = [];
  severe.forEach(f => reasons.push({cls:"bad", t:"Red flag berat: " + f.t}));
  sjt.flags.filter(f => f.sev !== "berat").forEach(f => reasons.push({cls:"warn", t:"Red flag: " + f.t}));
  if(sjt.pct < 60) reasons.push({cls:"bad", t:`Skor situasi jaga anak rendah (${sjt.pct}%).`});
  else if(sjt.pct < 80) reasons.push({cls:"warn", t:`Skor situasi jaga anak cukup (${sjt.pct}%). Beberapa jawaban kurang tepat.`});
  else reasons.push({cls:"good", t:`Keputusan di situasi jaga anak baik (${sjt.pct}%).`});
  lowScales.forEach(k => reasons.push({cls:"bad", t:`${SCALES[k].name} rendah (${lk.scales[k].score}).`}));
  if(lk && !lowScales.length){
    const mids = Object.keys(SCALES).filter(k => lk.scales[k].band.k === "mid");
    if(mids.length) reasons.push({cls:"warn", t:`Perlu digali: ${mids.map(k => SCALES[k].name.toLowerCase()).join(", ")}.`});
    else reasons.push({cls:"good", t:"Semua skala karakter kerja tinggi."});
  }
  const inflated = !!(lk && lk.lie >= 3);
  if(inflated) reasons.push({cls:"warn", t:"Jawaban karakter terlalu sempurna. Skor bisa lebih tinggi dari aslinya, jadi andalkan wawancara dan referensi."});
  if(quality.level.cls !== "good") reasons.push({cls:quality.level.cls, t:`Keandalan jawaban: ${quality.level.t.toLowerCase()}.`});

  let verdict;
  if(severe.length || sjt.flags.length >= 2 || overall < 50)
    verdict = {key:"bad", t:"Hati-hati", cls:"bad", why:"Ada jawaban yang berisiko untuk keamanan anak atau kejujuran."};
  else if(quality.level.t === "Rendah")
    verdict = {key:"warn", t:"Ulangi tes", cls:"warn", why:"Jawaban kurang bisa dipercaya. Ulangi tes sambil didampingi, lalu bandingkan."};
  else if(sjt.flags.length || overall < 70 || quality.level.cls === "warn" || lowScales.length)
    verdict = {key:"warn", t:"Lanjut dengan catatan", cls:"warn", why:"Bisa lanjut ke wawancara, tapi gali dulu poin-poin di bawah."};
  else
    verdict = {key:"good", t:"Lanjut ke trial", cls:"good", why:"Keputusan jaga anak, karakter kerja, dan keandalan jawaban semuanya baik."};

  const bioNotes = [];
  if(Array.isArray(c.bio)) BIO.forEach((b, i) => { const n = BIO_NOTES[b.id]?.[c.bio[i]]; if(n) bioNotes.push(n); });

  // Interview guide: weakest areas first.
  const asks = [];
  severe.concat(sjt.flags.filter(f => f.sev !== "berat")).forEach(f => asks.push(SCEN[f.i].probe));
  if(lk) Object.keys(SCALES).filter(k => lk.scales[k].band.k !== "hi").sort((a,b) => lk.scales[a].score - lk.scales[b].score).forEach(k => asks.push(SCALES[k].ask));
  STYLE[disc.primary].ask.forEach(q => asks.push(q));
  asks.push("Boleh saya telepon majikan terakhir kamu? Siapa namanya dan berapa nomornya?");

  return {disc, sjt, lk, quality, overall, inflated, overallBand:BAND(overall), verdict, reasons, bioNotes, asks:[...new Set(asks)],
    // flat aliases used by lists and tables
    primary:disc.primary, secondary:disc.secondary, flags:sjt.flags, scenPct:sjt.pct};
}

/* ---------- Sign-in: 6-digit PIN checked by the server (bcrypt, 5 tries then a 15-minute lock).
   The server hands back a session token that expires 30 minutes after the last use. ---------- */
async function rpc(fn, args = {}){
  const r = await fetch(SB_URL + "/rest/v1/rpc/" + fn, {method:"POST", headers:{apikey:SB_KEY, Authorization:"Bearer " + SB_KEY, "Content-Type":"application/json"}, body:JSON.stringify(args)});
  const txt = await r.text(); let j = null; try{ j = txt ? JSON.parse(txt) : null; }catch{}
  if(!r.ok) throw {status:r.status, code:j?.code || "", msg:j?.message || ""};
  return j;
}
const Auth = {
  token:null,
  load(){ try{ const t = sessionStorage.getItem("tp_admin_token"); if(/^[0-9a-f]{64}$/.test(t || "")) this.token = t; }catch{} },
  save(){ try{ this.token ? sessionStorage.setItem("tp_admin_token", this.token) : sessionStorage.removeItem("tp_admin_token"); }catch{} },
  async login(pin){ const j = await rpc("tes_pengasuh_login", {p_pin:pin}); if(j?.ok){ this.token = j.token; this.save(); } return j; },
  async setup(code, pin){ const j = await rpc("tes_pengasuh_setup", {p_code:code, p_pin:pin}); if(j?.ok){ this.token = j.token; this.save(); } return j; },
  async logout(){ const t = this.token; this.token = null; this.save(); if(t) try{ await rpc("tes_pengasuh_logout", {p_token:t}); }catch{} },
};
// Admin calls: any "unauthorized" answer means the session is over.
async function api(fn, args = {}){
  if(!Auth.token) return sessionEnded();
  try{ return await rpc(fn, {p_token:Auth.token, ...args}); }
  catch(e){ if(e.status === 403 || e.code === "28000") return sessionEnded(); throw e; }
}
function sessionEnded(){
  Auth.token = null; Auth.save();
  S.login = {stage:"login", buf:"", err:"Sesi berakhir. Masukkan PIN lagi."};
  S.list = null; go("login");
  throw {status:401, ended:true};
}

  </div></div>` : ""}
  <p class="note">Skor membantu menyaring, bukan memutuskan. Keputusan terbaik tetap dari wawancara, cek referensi, dan masa percobaan. Lihat tab Metode.</p>`;
}

function resultView(){
  if(S.list === null) return header() + `<div class="card"><p class="muted">Memuat hasil…</p></div>`;
  const c = S.list.find(x => x.id === S.selId);
  if(!c) return header() + `<button class="link" data-act="tab" data-t="hasil">← Hasil tes</button><div class="card"><p class="muted">Data calon tidak ditemukan.</p></div>`;
  const r = res(c), st = statusOf(c), P = STYLE[r.primary], Sec = r.secondary ? STYLE[r.secondary] : null;
  const contact = c.phone ? `<div class="stack" style="gap:8px;margin-top:6px">
      <span class="num">HP: <b>${fmtPhone(c.phone)}</b></span>
      <div class="row nowrap" style="gap:8px">
        <a class="btn ghost" style="min-height:40px;padding:6px 14px" href="${waLink(c.phone)}" target="_blank" rel="noopener">Chat WhatsApp</a>
        <a class="btn ghost" style="min-height:40px;padding:6px 14px" href="tel:${c.phone}">Telepon</a>
      </div>
    </div>` : `<p class="small muted">Nomor HP tidak tercatat (tes versi lama).</p>`;
  const meta = [c.age ? esc(c.age)+" tahun" : "", c.origin ? esc(c.origin) : "", "Tes " + fmtDate(c.finishedAt),
    c.finishedAt && c.startedAt ? fmtSec((c.finishedAt - c.startedAt)/1000) : ""].filter(Boolean).join(" · ");

  // DISC bars
  const max = Math.max(8, ...Object.values(r.disc.d).map(Math.abs));
  const discBars = ["D","I","S","C"].map(k => {
    const v = r.disc.d[k], w = Math.abs(v)/max*50, left = v >= 0 ? 50 : 50 - w;
    return `<div class="dbar"><span class="dl" style="color:var(--d${k})">${k}</span>
      <div class="track2"><div class="mid"></div><div class="fill" style="left:${left}%;width:${w}%;background:var(--d${k})"></div></div>
      <span class="dv">${v > 0 ? "+" : ""}${v}</span></div>`;
  }).join("");

  const scalesHtml = r.lk ? Object.keys(SCALES).map(k => {
    const s = r.lk.scales[k], info = SCALES[k];
    return `<div class="scale-row">
      <div class="spread"><b style="min-width:0">${info.name}</b><span class="row nowrap" style="gap:8px"><span class="num"><b>${s.score}</b></span><span class="chip ${s.band.cls}">${s.band.t}</span></span></div>
      <div class="meter">${meter(s.score, s.band.cls, true)}</div>
      <p class="small muted">${info[s.band.k]}</p>
    </div>`;
  }).join("") : `<p class="muted small">Bagian ini belum ada di versi tes yang dikerjakan calon ini. Kirim ulang link tes terbaru kalau ingin melihat karakter kerjanya.</p>`;

  const dimsHtml = Object.entries(r.sjt.dims).filter(([,x]) => x.pct != null).map(([k, x]) =>
    `<div class="meter"><div class="spread small"><span>${DIMS[k]}</span><b class="num">${x.pct}%</b></div>${meter(x.pct, pctCls(x.pct))}</div>`).join("");

  const ansList = r.sjt.answers.map(a => {
    const sc = SCEN[a.i];
    const chip = a.pts === 3 ? `<span class="chip good">Tepat</span>` : a.pts === 2 ? `<span class="chip neutral">Cukup</span>` : `<span class="chip ${a.pts === 0 ? "bad" : "warn"}">${a.pts === 0 ? "Berisiko" : "Kurang tepat"}</span>`;
    return `<div class="ans">
      <span class="q">${a.i+1}. ${esc(sc.t)}</span>
      <div class="spread" style="align-items:flex-start"><span class="a">${esc(a.txt)}</span>${chip}</div>
      ${a.flag ? `<span class="flag">Red flag${a.sev === "berat" ? " berat" : ""}: ${esc(a.flag)}</span>` : ""}
      ${a.pts <= 1 ? `<p class="probe"><b>Tanya:</b> "Kenapa pilih itu?" ${esc(sc.probe)}</p>` : ""}
    </div>`;
  }).join("");

  const strongList = r.lk && r.lk.strong.length ? r.lk.strong.map(s => `<li><span class="muted">${esc(SCALES[s.k].short)}:</span> "${esc(LIK[s.i].t)}" → <b>${LIKERT_SCALE[s.v-1]}</b></li>`).join("") : "";
  const bioHtml = Array.isArray(c.bio) ? `<dl class="kv">${BIO.map((b, i) => `<dt>${esc(b.q)}</dt><dd>${esc(b.o[c.bio[i]] ?? "-")}</dd>`).join("")}</dl>` : `<p class="muted small">Tidak ada di versi tes ini.</p>`;

  return header() + `
  <button class="link" data-act="tab" data-t="hasil">← Hasil tes</button>
  <div class="stack" style="gap:4px"><h1>${esc(c.name)}</h1><p class="muted small">${meta}</p>${contact}</div>
  <div class="stack" style="gap:6px">
    <span class="eyebrow">Status rekrutmen</span>
    <div class="seg" role="group" aria-label="Status rekrutmen">${STATUSES.map(s => `<button class="${s===st?"on":""}" data-act="setstatus" data-s="${s}" aria-pressed="${s===st}">${s}</button>`).join("")}</div>
  </div>

  <section class="card">
    <div class="hero">
      ${ring(r.overall, r.overallBand.cls, 92)}
      <div class="stack" style="gap:4px">
        <span class="eyebrow">Kesimpulan awal · skor ${r.overall}/100</span>
        <span class="v ${r.verdict.cls}">${r.verdict.t}</span>
        <p class="small muted">${r.verdict.why}</p>
      </div>
    </div>
    <ul class="reasons">${r.reasons.map(x => `<li><i class="dotc ${x.cls}"></i><span>${esc(x.t)}</span></li>`).join("")}</ul>
  </section>

  <section class="card">
    <div class="card-h"><h2>Keandalan jawaban</h2><span class="chip ${r.quality.level.cls}">${r.quality.level.t}</span></div>
    ${r.quality.issues.length ? `<ul class="plain small">${r.quality.issues.map(x => `<li>${esc(x.t)}</li>`).join("")}</ul>
      ${r.quality.level.t !== "Baik" ? `<p class="note">Kalau keandalan rendah, ulangi tes sambil didampingi dan bacakan soalnya.</p>` : ""}`
      : `<p class="small muted">Tidak ada tanda asal pilih atau jawaban yang dibuat-buat. Jawaban konsisten.</p>`}
  </section>

  <div class="cols two">
    <section class="card">
      <div class="card-h"><h2>Situasi jaga anak</h2><span class="num"><b>${r.sjt.pct}%</b> <span class="muted small">bobot 40%</span></span></div>
      ${dimsHtml}
      ${r.flags.length ? `<div class="stack" style="gap:4px">${r.flags.map(f => `<span class="flag">Red flag${f.sev === "berat" ? " berat" : ""}: ${esc(f.t)}</span>`).join("")}</div>` : `<p class="small muted">Tidak ada red flag.</p>`}
    </section>
    <section class="card">
      <div class="card-h"><h2>Karakter kerja</h2>${r.lk ? `<span class="muted small">bobot 15% per skala</span>` : ""}</div>
      ${scalesHtml}
    </section>
  </div>

  <section class="card">
    <div class="card-h"><h2>Gaya kerja (DISC)</h2><span class="chip ${r.disc.fit.cls}">${r.disc.fit.t} untuk balita</span></div>
    <p class="note">Menggambarkan cara kerja dan cara mengarahkan. Tidak dipakai untuk skor lolos.</p>
    ${discBars}
    <div class="scale-legend"><span></span><div><span>rendah</span><span>tinggi</span></div><span></span></div>
    <div class="stack" style="gap:4px">
      <h3 style="color:${P.color}">${r.primary} · ${P.name}</h3>
      <p>${P.gist}</p>
      ${Sec ? `<p class="small muted">Gaya kedua: <b style="color:${Sec.color}">${r.secondary} · ${Sec.name}</b>. ${Sec.gist}</p>` : ""}
    </div>
    <div class="cols two">
      <div class="stack" style="gap:6px"><h3>Kelebihan</h3><ul class="plain small">${P.plus.map(x => `<li>${x}</li>`).join("")}</ul></div>
      <div class="stack" style="gap:6px"><h3>Yang perlu diawasi</h3><ul class="plain small">${P.watch.map(x => `<li>${x}</li>`).join("")}</ul></div>
    </div>
    <div class="stack" style="gap:6px"><h3>Cara mengarahkan</h3><ul class="plain small">${P.lead.map(x => `<li>${x}</li>`).join("")}</ul></div>
    <p class="probe"><b>Saat trial:</b> ${P.trial}</p>
  </section>

  <div class="cols two">
    <section class="card">
      <h2>Latar belakang</h2>
      ${bioHtml}
      ${r.bioNotes.length ? `<ul class="plain small">${r.bioNotes.map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : ""}
    </section>
    <section class="card">
      <h2>Panduan wawancara</h2>
      <ol class="plain small">${r.asks.map(q => `<li>${esc(q)}</li>`).join("")}</ol>

  <details class="card more">
    <summary>Jawaban per cerita (${r.sjt.answers.length})</summary>

    <summary>Jawaban karakter yang menonjol (${r.lk.strong.length})</summary>
    <p class="note">Kalimat yang dijawab ke arah kurang baik. Bagus untuk ditanyakan saat wawancara.</p>
    <ul class="plain small">${strongList}</ul>

  <section class="card">

    ? `<div class="confirm"><b>Hapus semua data ${esc(c.name)}?</b><p class="small muted">Tidak bisa dibatalkan.</p><div class="row"><button class="btn danger" data-act="delyes">Ya, hapus</button><button class="btn ghost" data-act="delno">Batal</button></div></div>`
    : `<button class="link" style="color:var(--bad)" data-act="del">Hapus data calon ini</button>`}`;
}

function compareView(){
  const items = S.cmp.map(id => (S.list||[]).find(c => c.id === id)).filter(Boolean).map(c => ({c, r:res(c)}));
  if(items.length < 2) return header() + `<button class="link" data-act="tab" data-t="hasil">← Hasil tes</button><div class="card"><p class="muted">Pilih minimal 2 calon untuk dibandingkan.</p></div>`;
  const best = (vals, high = true) => { const ok = vals.filter(v => v != null); if(!ok.length) return vals.map(() => false); const m = high ? Math.max(...ok) : Math.min(...ok); return vals.map(v => v === m && ok.filter(x => x === m).length < ok.length); };
  const row = (label, cells, marks) => `<tr><th scope="row">${label}</th>${cells.map((x, i) => `<td class="${marks?.[i] ? "best" : ""}">${x}</td>`).join("")}</tr>`;
  const sec = t => `<tr class="sec"><th colspan="${items.length+1}">${t}</th></tr>`;
  const ov = items.map(x => x.r.overall), sj = items.map(x => x.r.sjt.pct), fl = items.map(x => x.r.flags.length);
  const sc = k => items.map(x => x.r.lk ? x.r.lk.scales[k].score : null);
  return header() + `
  <button class="link" data-act="tab" data-t="hasil">← Hasil tes</button>
  <div class="stack" style="gap:4px"><h1>Bandingkan calon</h1><p class="muted small">Hijau tebal = terbaik di antara yang dibandingkan. Geser tabel ke samping di HP.</p></div>
  <div class="ctable"><table>
    <thead><tr><th></th>${items.map(({c}) => `<th scope="col"><button class="link" data-act="open" data-id="${esc(c.id)}">${esc(c.name)}</button></th>`).join("")}</tr></thead>
    <tbody>
      ${row("Skor keseluruhan", ov.map(String), best(ov))}
      ${row("Kesimpulan", items.map(({r}) => `<span class="chip ${r.verdict.cls}">${r.verdict.t}</span>`))}
      ${row("Keandalan", items.map(({r}) => `<span class="chip ${r.quality.level.cls}">${r.quality.level.t}</span>`))}
      ${row("Status", items.map(({c}) => `<span class="chip ${statusCls(statusOf(c))}">${statusOf(c)}</span>`))}
      ${sec("Situasi jaga anak")}
      ${row("Total", sj.map(v => v + "%"), best(sj))}
      ${Object.keys(DIMS).map(k => { const v = items.map(({r}) => r.sjt.dims[k].pct); return row(DIMS[k], v.map(x => x == null ? "-" : x + "%"), best(v)); }).join("")}
      ${row("Red flag", items.map(({r}) => r.flags.length ? `<b style="color:var(--bad)">${r.flags.length}</b><ul class="plain small">${r.flags.map(f => `<li>${esc(f.t)}</li>`).join("")}</ul>` : "0"), best(fl, false))}
      ${sec("Karakter kerja")}
      ${Object.keys(SCALES).map(k => { const v = sc(k); return row(SCALES[k].name, v.map(x => x == null ? "-" : x), best(v)); }).join("")}
      ${sec("Gaya kerja")}
      ${row("Gaya utama", items.map(({r}) => `<b style="color:${STYLE[r.primary].color}">${r.primary}${r.secondary||""}</b> ${STYLE[r.primary].name}`))}
      ${row("Kecocokan gaya", items.map(({r}) => `<span class="chip ${r.disc.fit.cls}">${r.disc.fit.t}</span>`))}
      ${sec("Lainnya")}
      ${row("Pengalaman", items.map(({c}) => Array.isArray(c.bio) ? esc(BIO[0].o[c.bio[0]]) : "-"))}
      ${row("Nomor HP", items.map(({c}) => c.phone ? `<a href="${waLink(c.phone)}" target="_blank" rel="noopener">${fmtPhone(c.phone)}</a>` : "-"))}
      ${row("Umur · asal", items.map(({c}) => [c.age ? esc(c.age) + " th" : "-", c.origin ? esc(c.origin) : ""].filter(Boolean).join(" · ")))}
      ${row("Catatan", items.map(({c}) => c.notes ? `<span class="small">${esc(c.notes)}</span>` : `<span class="muted">-</span>`))}
    </tbody>
  </table></div>`;
}

      <div><b>3. Pengecekan keandalan (10 kalimat + waktu)</b><p class="muted">5 pernyataan "terlalu sempurna" untuk mendeteksi jawaban yang dibuat-buat, 1 soal perintah ("tekan Tidak cocok") untuk mengecek apakah calon membaca, 4 pasang kalimat dengan arti sama untuk mengecek konsistensi, pola jawaban yang sama terus, dan kecepatan menjawab.</p></div>
      <div><b>4. Gaya kerja DISC (20 soal)</b><p class="muted">Pilihan paksa paling mirip dan paling tidak mirip. Dipakai untuk memahami cara kerja dan cara mengarahkan. DISC tidak dipakai untuk skor lolos karena tidak terbukti memprediksi kinerja.</p></div>

/* ---------- Render ---------- */
function render(){
  const V = {loading:() => plainTop() + `<div class="card"><p class="muted">Memuat…</p></div>`,
    login:loginView, home:homeView, result:resultView, compare:compareView, kirim:kirimView, metode:metodeView};
  $app.className = "wrap" + (["home","compare","result"].includes(S.view) ? " wide" : "");
  $app.innerHTML = (V[S.view] || V.loading)();
}
function go(view){
  S.tab = view === "kirim" ? "kirim" : view === "metode" ? "metode" : "hasil";
  S.view = view; render(); window.scrollTo(0, 0);
}
async function loadList(){
  try{ S.list = await Store.list(); S.loadedAt = Date.now(); }
  catch(e){ if(e?.ended) return; S.list = S.list || []; S.flash = {cls:"bad", t:"Gagal memuat data. Cek koneksi lalu tekan Perbarui."}; }
  S.cache = new Map();
  S.cmp = S.cmp.filter(id => S.list.some(c => c.id === id));
  if(["home","result","compare"].includes(S.view)) render();
}

// After sign-in (or a restored tab session): check admin access, load the answer keys, open the dashboard.
async function enter(){
  const cfg = await api("tes_pengasuh_config");
  if(!cfg) throw {code:"no_config"};
  ({SCEN, LIK, BIO_NOTES} = hydrate(SCEN_TXT, LIK_TXT, cfg));
  S.cache = new Map(); S.list = null;
  go(S.after || "home"); await loadList();
}

async function importCode(text){
  const m = String(text || "").match(/tp[123]\.[A-Za-z0-9._~-]+/);
  const rec = m && decodeCode(m[0]);
  if(!rec){ S.importErr = "Kode jawaban tidak dikenali. Pastikan seluruh pesan dari calon ikut ditempel dan tidak diubah."; render(); return; }
  const id = rec.id.slice(1);
  try{
    const added = await Store.insert(id, m[0]);
    S.flash = {cls:"good", t: added ? `Jawaban ${rec.name} sudah masuk.` : `Jawaban ${rec.name} sudah pernah dimasukkan.`};
  }catch(e){ if(e?.ended) return; S.importErr = "Gagal menyimpan. Cek koneksi lalu coba lagi."; render(); return; }
  S.importErr = ""; S.selId = id; S.list = null; go("result"); await loadList();
}

/* ---------- Actions ---------- */
const act = {
  digit(ds){
    const L = S.login; if(S.sending || L.buf.length >= 6) return;
    L.buf += ds.d; L.err = ""; render();
    if(L.buf.length === 6) signIn(L.buf);
  },
  pinclear(){ S.login.buf = ""; render(); },
  pinback(){ S.login.buf = S.login.buf.slice(0, -1); render(); },
  async logout(){ await Auth.logout(); S.list = null; S.selId = null; S.invite = ""; S.flash = null; S.cmp = []; S.login = {stage:"login", buf:"", err:""}; go("login"); },
  tab(ds){
    S.flash = null; S.confirmDel = false; S.noteMsg = "";
    go(ds.t === "kirim" ? "kirim" : ds.t === "metode" ? "metode" : "home");
    if(S.list === null || (ds.t === "hasil" && Date.now() - S.loadedAt > 60000)) loadList();
  },
  open(ds){ S.selId = ds.id; S.confirmDel = false; S.noteMsg = ""; S.flash = null; go("result"); },
  filt(ds){ S.filter = (S.filter === ds.f && ds.f !== "all") ? "all" : ds.f; render(); },
  filtreset(){ S.filter = "all"; S.fStatus = "all"; S.q = ""; render(); },
  cmp(ds){
    const i = S.cmp.indexOf(ds.id);
    if(i >= 0) S.cmp.splice(i, 1);
    else if(S.cmp.length < 3) S.cmp.push(ds.id);
    else S.flash = {cls:"warn", t:"Maksimal 3 calon untuk dibandingkan."};
    render();
  },
  cmpclear(){ S.cmp = []; S.flash = null; render(); },
  compare(){ S.flash = null; go("compare"); },
  async setstatus(ds){
    const c = S.list?.find(x => x.id === S.selId); if(!c || statusOf(c) === ds.s) return;
    const prev = c.status; c.status = ds.s; render();
    try{ await Store.patch(c.id, {status:ds.s}); }
    catch(e){ if(e?.ended) return; c.status = prev; S.flash = {cls:"bad", t:"Status gagal disimpan. Cek koneksi lalu coba lagi."}; render(); }
  },
  async savenote(){
    const v = document.getElementById("notes").value;
    try{ await Store.patch(S.selId, {notes:v}); const c = S.list.find(x => x.id === S.selId); if(c) c.notes = v; S.noteMsg = "Tersimpan."; }
    catch{ S.noteMsg = "Gagal menyimpan. Coba lagi."; }
    render();
  },
  del(){ S.confirmDel = true; render(); },
  delno(){ S.confirmDel = false; render(); },
  async delyes(){
    try{
      await Store.remove(S.selId);
      S.list = S.list.filter(x => x.id !== S.selId); S.cmp = S.cmp.filter(x => x !== S.selId);
      S.selId = null; S.confirmDel = false; S.flash = {cls:"good", t:"Data calon sudah dihapus."}; go("home");
    }catch(e){ if(e?.ended) return; S.confirmDel = false; S.flash = {cls:"bad", t:"Gagal menghapus. Coba lagi."}; render(); }
  },
  makelink(){
    S.cname = document.getElementById("f-cname").value.trim();
    const url = CAND_URL + (S.cname ? "?n=" + encodeURIComponent(S.cname) : "");
    S.invite = `Halo${S.cname ? " " + S.cname : ""}, ini tes untuk lowongan pengasuh anak.\n\nKerjakan di HP kamu sendiri, di tempat yang tenang. Waktunya sekitar 30 menit. Kalau terputus, buka lagi link-nya, jawaban tetap tersimpan.\n\nSetelah soal terakhir, jawaban kamu otomatis terkirim.\n\n${url}`;
    S.copyMsg = ""; S.flash = null; render();
  },
  refresh(){ S.flash = null; loadList(); },
  copyinvite(){
    const ta = document.getElementById("invite");
    try{
      navigator.clipboard.writeText(ta.value).then(
        () => { S.copyMsg = "Pesan sudah disalin. Tempel di chat calon."; render(); },
        () => { ta.select(); S.copyMsg = "Teks sudah dipilih. Salin manual dari menu HP."; document.querySelector('[role="status"]').textContent = S.copyMsg; });
    }catch{ ta.select(); }
  },
  paste(){ importCode(document.getElementById("f-code").value); },
};

$app.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if(!b || b.disabled) return;
  if(b.tagName === "A") return;
  act[b.dataset.act]?.(b.dataset, b);
});
$app.addEventListener("input", e => {
  if(e.target.id !== "f-q") return;
  S.q = e.target.value; render();
  const el = document.getElementById("f-q"); el.focus(); el.setSelectionRange(el.value.length, el.value.length);
});
$app.addEventListener("change", e => {
  if(e.target.id === "f-sort"){ S.sort = e.target.value; render(); }
  if(e.target.id === "f-status"){ S.fStatus = e.target.value; render(); }
});
$app.addEventListener("keydown", e => {
  if((e.key === "Enter" || e.key === " ") && e.target.matches('[role="button"][data-act]')){ e.preventDefault(); e.target.click(); }
});
$app.addEventListener("submit", e => {
  e.preventDefault();
  if(e.target.id === "f-setup") setupPin();
  if(e.target.id === "f-chpin") changePin();
});
document.addEventListener("keydown", e => {
  if(S.view !== "login" || S.login.stage !== "login" || e.target.matches?.("input,textarea")) return;
  if(/^[0-9]$/.test(e.key)) act.digit({d:e.key});
  else if(e.key === "Backspace") act.pinback();
});

async function signIn(pin){
  S.sending = true; render();
  let j = null;
  try{ j = await Auth.login(pin); }catch{ j = {ok:false, reason:"net"}; }
  S.sending = false; S.login.buf = "";
  if(j?.ok){
    lastActive = Date.now();
    try{ await enter(); }catch(e){ if(e?.ended) return; S.login.err = "Gagal memuat data. Coba lagi."; go("login"); }
    return;
  }
  S.login.err = j?.reason === "wrong" ? `PIN salah. Sisa ${j.left} kali sebelum dikunci 15 menit.`
    : j?.reason === "locked" ? lockMsg(j.until)
    : j?.reason === "no_pin" ? ""
    : "Gagal masuk. Cek koneksi lalu coba lagi.";
  if(j?.reason === "no_pin") S.login.stage = "setup";
  render();
}
async function setupPin(){
  const code = document.getElementById("s-code").value, pin = document.getElementById("s-pin").value, pin2 = document.getElementById("s-pin2").value;
  const fail = t => { S.login.err = t; render(); };
  if(!/^[0-9]{6}$/.test(pin)) return fail("PIN harus 6 angka.");
  if(pin !== pin2) return fail("PIN dan ulangan PIN tidak sama.");
  S.sending = true; render();
  let j = null;
  try{ j = await Auth.setup(code, pin); }catch{ j = {ok:false, reason:"net"}; }
  S.sending = false;
  if(j?.ok){ lastActive = Date.now(); S.login = {stage:"login", buf:"", err:""}; try{ await enter(); }catch(e){ if(!e?.ended) fail("Gagal memuat data. Coba lagi."); } return; }
  fail(j?.reason === "weak_pin" ? "PIN terlalu mudah ditebak. Pakai kombinasi lain."
    : j?.reason === "wrong" ? `Kode setup salah. Sisa ${j.left} kali sebelum dikunci 15 menit.`
    : j?.reason === "locked" ? lockMsg(j.until)
    : j?.reason === "no_setup" ? "Kode setup sudah dipakai. Masuk dengan PIN."
    : "Gagal menyimpan. Cek koneksi lalu coba lagi.");
  if(j?.reason === "no_setup"){ S.login.stage = "login"; render(); }
}
async function changePin(){
  const old = document.getElementById("c-old").value, pin = document.getElementById("c-new").value, pin2 = document.getElementById("c-new2").value;
  const done = (cls, t) => { S.flash = {cls, t}; render(); window.scrollTo(0, 0); };
  if(!/^[0-9]{6}$/.test(pin)) return done("warn", "PIN baru harus 6 angka.");
  if(pin !== pin2) return done("warn", "PIN baru dan ulangannya tidak sama.");
  let j = null;
  try{ j = await api("tes_pengasuh_change_pin", {p_old:old, p_new:pin}); }catch(e){ if(e?.ended) return; j = {ok:false, reason:"net"}; }
  if(j?.ok) return done("good", "PIN sudah diganti. Perangkat lain yang masih masuk sudah dikeluarkan.");
  done(j?.reason === "locked" ? "bad" : "warn", j?.reason === "weak_pin" ? "PIN baru terlalu mudah ditebak."
    : j?.reason === "wrong" ? `PIN lama salah. Sisa ${j.left} kali sebelum dikunci 15 menit.`
    : j?.reason === "locked" ? lockMsg(j.until) : "Gagal mengganti PIN. Coba lagi.");
}

// Sign out after 30 minutes without activity.
let lastActive = Date.now();
["click","keydown","touchstart","scroll"].forEach(ev => window.addEventListener(ev, () => { lastActive = Date.now(); }, {passive:true}));
setInterval(() => {
  if(Auth.token && Date.now() - lastActive > IDLE_MS){
    Auth.logout(); S.list = null; S.cmp = [];
    S.login = {stage:"login", buf:"", err:"Kamu keluar otomatis karena tidak aktif 30 menit."};
    go("login");
  }
}, 1000);
document.addEventListener("visibilitychange", () => {
  if(document.visibilityState === "visible" && Auth.token && S.view === "home" && Date.now() - S.loadedAt > 60000) loadList();
});

/* ---------- Boot ---------- */
(async function boot(){
  const h = (location.hash || "").slice(1);
  S.after = h === "kirim" ? "kirim" : h === "metode" ? "metode" : "home";
  Auth.load(); render();
  if(Auth.token){ try{ await enter(); return; }catch(e){ if(e?.ended) return; await Auth.logout(); } }
  let st = null; try{ st = await rpc("tes_pengasuh_status"); }catch{}
  S.login = {stage: st && !st.pin_set ? "setup" : "login", buf:"", err: st?.locked_until ? lockMsg(st.locked_until) : st ? "" : "Tidak bisa terhubung. Cek koneksi lalu muat ulang halaman."};
  go("login");
})();
</script>
