<style>
/* Candidate test. One question per screen, big tap targets, plain words. No scoring lives here. */
:root{
  --bg:#EEF4F2; --surface:#FFFFFF; --sunk:#E3ECE9; --ink:#132B27; --muted:#556964; --line:#D0DDD9;
  --accent:#15705D; --accent-ink:#FFFFFF; --accent-soft:#D5ECE5;
  --most:#1C8748; --most-soft:#DBF1E3; --least:#BD3A2A; --least-soft:#F8DFDA;
  --wa:#1FA855; --shadow:0 1px 2px rgb(19 43 39 / .06), 0 4px 16px rgb(19 43 39 / .06);
  --font:'Lexend', ui-rounded, 'Segoe UI', system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0D1715; --surface:#14211D; --sunk:#1B2A26; --ink:#E3EEEA; --muted:#9AB0AA; --line:#283A35;
  --accent:#4DC1A5; --accent-ink:#06201A; --accent-soft:#163A31;
  --most:#4CC27F; --most-soft:#163724; --least:#F07A6A; --least-soft:#3D1E19; --wa:#2BC066;
  --shadow:none; color-scheme:dark}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
p{margin:0}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.shell{max-width:560px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);padding-block:12px 10px;display:flex;flex-direction:column;gap:10px}
.bar-row{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:36px}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:.95rem}
.mark{width:32px;height:32px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:700;font-size:.8rem;flex:none}
.part{font-size:.82rem;font-weight:600;color:var(--muted)}
.progress{height:6px;border-radius:99px;background:var(--sunk);overflow:hidden}
.progress span{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s ease}
main{flex:1;display:flex;flex-direction:column;gap:18px;padding-block:8px 28px}
.foot{position:sticky;bottom:0;background:linear-gradient(to top, var(--bg) 70%, transparent);padding-block:14px calc(14px + env(safe-area-inset-bottom,0px));display:flex;gap:10px}

.stack{display:flex;flex-direction:column;gap:6px}
.prt div{display:flex;flex-direction:column;min-width:0}
.title{font-size:1.65rem;font-weight:600;line-height:1.25;text-wrap:balance}
.lead{font-size:1.12rem}
.muted{color:var(--muted)}
.small{font-size:.9rem}
.eyebrow{font-size:.8rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}
.tips{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:12px}
.tips li{display:flex;gap:12px;align-items:flex-start}
.tips .n{flex:none;width:28px;height:28px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;font-size:.85rem}
.parts{display:flex;flex-direction:column;gap:10px}
.prt{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:12px;background:var(--sunk)}
.prt b{display:block}
.prt .num{flex:none;width:34px;height:34px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:700}

.btn{display:flex;align-items:center;justify-content:center;gap:10px;border:0;border-radius:14px;padding:14px 20px;font-weight:600;font-size:1.08rem;
  background:var(--accent);color:var(--accent-ink);min-height:56px;width:100%;text-decoration:none;transition:transform .1s}
.btn:active{transform:scale(.98)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line);width:auto;flex:none;padding-inline:18px}
.btn.wa{background:var(--wa);color:#fff;font-size:1.15rem;min-height:64px}
.btn svg{width:24px;height:24px;flex:none}
.listen{display:inline-flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-weight:500;font-size:.88rem;flex:none}
.listen svg{width:18px;height:18px}

label{display:flex;flex-direction:column;gap:8px;font-weight:500;font-size:1.05rem}
input,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;width:100%;min-height:54px}
textarea{min-height:120px;font-size:.85rem}
.err{color:var(--least);font-weight:500;font-size:.95rem}

.q{font-size:1.32rem;font-weight:500;line-height:1.4;text-wrap:pretty}
.story{font-size:1.2rem;line-height:1.55;background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--accent);padding:16px 16px 16px 18px;border-radius:14px;box-shadow:var(--shadow)}
.ask{font-weight:600;font-size:1.1rem}
.step{padding:12px 14px;border-radius:12px;font-weight:600;font-size:1.02rem;display:flex;align-items:center;gap:10px}
.step.m{background:var(--most-soft);color:var(--most)}
.step.l{background:var(--least-soft);color:var(--least)}
.step.ok{background:var(--accent-soft);color:var(--accent)}
.step .dot{width:12px;height:12px;border-radius:50%;background:currentColor;flex:none}

.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:center;gap:14px;text-align:left;width:100%;padding:15px 16px;border-radius:14px;border:2px solid var(--line);background:var(--surface);
  font-size:1.1rem;line-height:1.4;min-height:62px;box-shadow:var(--shadow);transition:border-color .12s, background .12s}
.opt .txt{flex:1;min-width:0}
.opt .letter{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:600;background:var(--sunk);font-size:.95rem}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .letter{background:var(--accent);color:var(--accent-ink)}
.opt .tag{flex:none;font-size:.72rem;font-weight:700;padding:4px 8px;border-radius:8px;letter-spacing:.02em}
.opt.m{border-color:var(--most);background:var(--most-soft)} .opt.m .tag{background:var(--most);color:#fff}
.opt.l{border-color:var(--least);background:var(--least-soft)} .opt.l .tag{background:var(--least);color:#fff}
.scale .opt{min-height:56px;padding-block:12px}
.dots{display:flex;gap:4px;flex:none}
.dots i{width:10px;height:10px;border-radius:50%;border:2px solid var(--accent);opacity:.9}
.dots i.f{background:var(--accent)}
.opt.sel .dots i{border-color:var(--accent)}

.example{display:flex;flex-direction:column;gap:8px;padding:14px;border-radius:14px;background:var(--sunk)}
.example .opt{box-shadow:none;min-height:auto;padding:10px 12px;font-size:.98rem;cursor:default}
.swatch{display:inline-block;padding:1px 8px;border-radius:6px;font-weight:700;color:#fff}
.swatch.m{background:var(--most)} .swatch.l{background:var(--least)}
.center{text-align:center}
.done-mark{width:76px;height:76px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;margin:8px auto 0}
.done-mark svg{width:40px;height:40px}
details summary{cursor:pointer;color:var(--muted);padding:6px 0}
.note{font-size:.82rem;color:var(--muted)}
.toast{background:var(--accent-soft);color:var(--accent);padding:10px 14px;border-radius:12px;font-size:.92rem;font-weight:500}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>

<script>
const BIO = [{"id":"exp","q":"Sudah berapa lama kamu kerja jadi pengasuh anak?","o":["Belum pernah","Kurang dari 1 tahun","1 sampai 3 tahun","Lebih dari 3 tahun"]},{"id":"baby","q":"Pernah mengasuh anak di bawah umur 2 tahun?","o":["Belum pernah","Pernah, sebentar saja","Pernah, lebih dari 6 bulan"]},{"id":"last","q":"Berapa lama kamu kerja di tempat terakhir?","o":["Belum pernah kerja","Kurang dari 6 bulan","6 bulan sampai 1 tahun","Lebih dari 1 tahun"]},{"id":"why","q":"Kenapa kamu berhenti dari tempat kerja terakhir?","o":["Belum pernah kerja","Kontrak atau kerjaan sudah selesai","Ada masalah dengan majikan","Urusan keluarga","Gaji kurang","Alasan lain"]},{"id":"plan","q":"Kalau diterima, kamu mau kerja di sini berapa lama?","o":["Kurang dari 1 tahun","1 sampai 2 tahun","Lebih dari 2 tahun","Belum tahu"]},{"id":"smoke","q":"Apakah kamu merokok?","o":["Tidak","Ya, kadang-kadang","Ya, setiap hari"]}];
const SCEN = [{"t":"Kakak (umur 2,5 tahun) jatuh dari kursi. Kepalanya terbentur. Dia menangis sebentar, lalu main lagi. Ibu sedang di kantor.","o":["Kompres kepalanya. Nanti kalau Ibu tanya, baru cerita.","Langsung telepon atau WA Ibu. Lalu terus awasi Kakak.","Tidak usah bilang. Dia sudah main lagi.","Cerita ke Ibu waktu Ibu pulang."]},{"t":"Kamu sedang masak. Kompor menyala. Adik (umur 1 tahun) menangis di kamar. Kakak main sendiri di ruang tamu.","o":["Selesaikan masak dulu. Sebentar lagi juga selesai.","Suruh Kakak lihat Adik.","Matikan kompor dulu, lalu lihat Adik.","Bawa Adik ke dapur. Gendong sambil masak."]},{"t":"Kakak minta HP untuk nonton. Ibu sudah bilang: tidak boleh HP sebelum makan. Kakak menangis keras sekali.","o":["Kasih HP sebentar supaya diam.","Tetap tidak kasih. Ajak main yang lain.","Kasih HP, tapi jangan bilang Ibu.","Telepon Ibu, tanya boleh atau tidak."]},{"t":"Ada orang datang ke rumah. Dia bilang teman Bapak dan mau mengambil barang. Bapak dan Ibu tidak bilang apa-apa ke kamu.","o":["Persilakan masuk. Kan teman Bapak.","Ambilkan barangnya. Dia tunggu di luar.","Minta dia tunggu di luar. Lalu telepon Bapak atau Ibu.","Suruh dia datang lagi nanti."]},{"t":"Kamu tidak sengaja memecahkan piring kesayangan Ibu. Ibu tidak melihat.","o":["Langsung bilang ke Ibu dan minta maaf.","Buang pecahannya dan diam saja. Mungkin Ibu tidak sadar.","Buang pecahannya. Kalau Ibu tanya, baru bilang.","Bilang Kakak yang memecahkan."]},{"t":"Adik dan Kakak sedang tidur siang.","o":["Main HP sambil tiduran di kamar saya.","Kerjakan pekerjaan rumah. Sering cek anak-anak.","Keluar sebentar beli jajan.","Ikut tidur di dekat anak-anak."]},{"t":"Waktu mencuci baju, kamu menemukan uang Rp100.000 di kantong celana Bapak.","o":["Taruh di meja kamar.","Simpan dulu. Kalau ada yang tanya, baru kasih.","Masukkan lagi ke kantong.","Kasih langsung ke Bapak atau Ibu."]},{"t":"Adik demam. Badannya panas. Ibu belum pulang.","o":["Kasih obat penurun panas yang ada di rumah.","Tunggu Ibu pulang. Nanti Ibu yang urus.","Tanya tetangga harus bagaimana.","Telepon Ibu, lalu kompres Adik."]},{"t":"Kakak memukul Adik sampai Adik menangis.","o":["Pukul tangan Kakak supaya kapok.","Pisahkan mereka. Bilang ke Kakak: tidak boleh memukul. Lalu cek Adik.","Marahi Kakak dengan suara keras.","Biarkan saja. Namanya juga anak kecil."]},{"t":"Kakak tidak mau makan. Sudah 30 menit.","o":["Paksa suapi sampai habis.","Kasih biskuit saja supaya kenyang.","Bilang: nanti dimarahi Ibu, lho.","Biarkan main dulu, coba lagi nanti. Lalu kasih tahu Ibu."]},{"t":"Adik sedang makan, lalu tersedak. Dia batuk-batuk keras.","o":["Kasih minum air yang banyak.","Biarkan dia batuk sambil diawasi. Kalau dia tidak bisa bernapas, tepuk punggungnya dengan kuat.","Ambil makanannya dari mulut pakai jari.","Telepon Ibu dulu, tanya harus bagaimana."]},{"t":"Kakak sedang lucu sekali. Kamu ingin memotretnya.","o":["Foto, lalu pasang di status WA atau media sosial saya.","Foto, lalu kirim ke Ibu saja.","Tidak usah foto. Fokus jaga anak.","Foto, lalu simpan di HP saya sendiri."]}];
const LIKERT_SCALE = ["Sangat tidak cocok","Tidak cocok","Ragu-ragu","Cocok","Sangat cocok"];
const LIK = [{"t":"Saya menyelesaikan kerjaan sampai beres."},{"t":"Saya sabar menghadapi anak yang rewel."},{"t":"Saya gampang panik."},{"t":"Saya mengaku kalau saya salah."},{"t":"Saya tidak pernah marah sama sekali, seumur hidup."},{"t":"Saya sering lupa tugas yang sudah disuruh."},{"t":"Saya gampang kesal kalau anak tidak menurut."},{"t":"Saya tetap tenang kalau ada masalah."},{"t":"Kalau tidak ketahuan, mengambil sedikit barang majikan itu tidak apa-apa."},{"t":"Saya menaruh barang kembali di tempatnya."},{"t":"Saya peduli kalau ada orang yang sedih."},{"t":"Saya tidak pernah bohong, satu kali pun."},{"t":"Saya gampang marah."},{"t":"Saya tetap berkata jujur, walaupun bisa kena marah."},{"t":"Saya suka menunda kerjaan."},{"t":"Soal ini untuk cek. Tekan jawaban \"Tidak cocok\"."},{"t":"Saya bicara dengan suara lembut ke anak kecil."},{"t":"Setelah dimarahi, saya cepat semangat lagi."},{"t":"Kadang saya pura-pura sakit supaya bisa libur."},{"t":"Saya suka semua orang yang pernah saya temui."},{"t":"Saya bangun dan datang tepat waktu."},{"t":"Saya membalas kalau ada orang yang kasar ke saya."},{"t":"Saya sering merasa sedih atau cemas."},{"t":"Saya mau bohong sedikit kalau itu menguntungkan saya."},{"t":"Saya kerja asal cepat selesai, tidak rapi."},{"t":"Saya tidak pernah malas, satu hari pun."},{"t":"Saya kurang suka lama-lama bersama anak kecil."},{"t":"Kalau ada kejadian mendadak, saya jadi bingung dan panik."},{"t":"Kerjaan yang saya mulai, pasti saya selesaikan sampai beres."},{"t":"Saya tidak pernah membicarakan orang lain di belakangnya."},{"t":"Kalau anak menangis lama, saya tetap sabar."},{"t":"Kalau saya berbuat salah, saya langsung bilang."},{"t":"Suasana hati saya biasanya baik."},{"t":"Saya tidak mau mengambil barang orang lain, sekecil apa pun."}];
const DISC = [{"q":"","o":{"D":"Saya suka kerja cepat, supaya cepat selesai.","I":"Saya senang ngobrol dengan orang di rumah.","S":"Saya suka kerjaan yang sama setiap hari.","C":"Saya suka barang ada di tempatnya."}},{"q":"Kalau ada masalah di rumah…","o":{"D":"Saya langsung cari jalan keluar sendiri.","I":"Saya cerita ke orang lain supaya dibantu.","S":"Saya tenang dulu, tidak buru-buru.","C":"Saya pikir dulu baik-baik, baru bertindak."}},{"q":"Teman bilang saya orangnya…","o":{"D":"Berani.","I":"Lucu dan ramai.","S":"Sabar.","C":"Teliti."}},{"q":"Kalau disuruh dengan cara yang menurut saya kurang bagus…","o":{"D":"Saya bilang cara saya lebih cepat.","I":"Saya ajak ngobrol baik-baik.","S":"Saya ikuti saja. Tidak enak kalau membantah.","C":"Saya tanya alasannya, supaya paham."}},{"q":"Waktu kerja, saya paling senang kalau…","o":{"D":"Kerjaan selesai lebih cepat dari waktunya.","I":"Suasana rumah ramai dan ceria.","S":"Semua orang di rumah akur dan tenang.","C":"Semua kerjaan rapi dan tidak ada yang salah."}},{"q":"","o":{"D":"Saya tidak suka menunggu lama.","I":"Saya gampang akrab dengan orang baru.","S":"Saya perlu waktu untuk biasa di tempat baru.","C":"Saya suka ada daftar kerjaan yang jelas."}},{"q":"Kalau saya sedang capek…","o":{"D":"Saya tetap paksa sampai selesai.","I":"Saya cari teman ngobrol supaya semangat lagi.","S":"Saya diam dan tetap kerja pelan-pelan.","C":"Saya atur lagi, mana yang harus duluan."}},{"q":"Saya paling tidak suka kalau…","o":{"D":"Disuruh terus, tidak boleh pakai cara sendiri.","I":"Kerja sendirian, tidak ada teman bicara.","S":"Aturan rumah sering berubah-ubah.","C":"Kerjaan dibuat asal-asalan."}},{"q":"Kalau main dengan anak kecil…","o":{"D":"Saya ajak main yang aktif, seperti kejar-kejaran.","I":"Saya nyanyi dan bikin dia ketawa.","S":"Saya temani dia main apa saja yang dia mau.","C":"Saya ajari dia hal baru, seperti warna atau angka."}},{"q":"Kalau ada aturan baru di rumah…","o":{"D":"Saya coba dulu. Kalau tidak cocok, saya bilang.","I":"Saya tanya-tanya ke orang lain di rumah.","S":"Saya perlu waktu supaya biasa.","C":"Saya catat supaya tidak lupa."}},{"q":"","o":{"D":"Saya suka jadi yang memimpin.","I":"Saya senang dipuji kalau kerja bagus.","S":"Saya senang membantu orang lain.","C":"Saya suka kerja yang hasilnya pasti."}},{"q":"Kalau ada orang marah ke saya…","o":{"D":"Saya jawab dan jelaskan saat itu juga.","I":"Saya coba bikin suasana enak lagi.","S":"Saya diam dan dengarkan.","C":"Saya cek dulu, apa saya memang salah."}},{"q":"Waktu hari libur, saya paling suka…","o":{"D":"Pergi ke tempat baru.","I":"Kumpul dan ngobrol dengan teman.","S":"Istirahat atau kumpul dengan keluarga.","C":"Membereskan barang-barang saya."}},{"q":"","o":{"D":"Saya cepat ambil keputusan.","I":"Saya gampang semangat.","S":"Saya tidak gampang marah.","C":"Saya hati-hati sebelum bicara."}},{"q":"Kalau anak menangis terus…","o":{"D":"Saya gendong dan bawa keluar supaya diam.","I":"Saya ajak ngomong dan bercanda supaya dia lupa.","S":"Saya peluk dan tunggu sampai dia tenang.","C":"Saya pakai cara yang sudah diajarkan Ibu."}},{"q":"Waktu belajar hal baru…","o":{"D":"Saya langsung coba sendiri.","I":"Saya cepat paham kalau diajak ngobrol.","S":"Saya perlu dicontohkan dulu, pelan-pelan.","C":"Saya perlu tahu langkahnya satu per satu."}},{"q":"Orang yang kenal saya kadang bilang…","o":{"D":"Saya keras kepala.","I":"Saya cerewet.","S":"Saya terlalu mengalah.","C":"Saya terlalu banyak tanya."}},{"q":"Kalau kerja bersama orang lain…","o":{"D":"Saya suka yang mengatur pembagian kerja.","I":"Saya yang bikin suasana jadi seru.","S":"Saya bantu di mana saja yang perlu.","C":"Saya pastikan semua dikerjakan dengan benar."}},{"q":"Saya merasa puas kalau…","o":{"D":"Saya berhasil mengerjakan hal yang susah.","I":"Orang di rumah senang dengan saya.","S":"Saya bisa kerja lama di satu tempat.","C":"Hasil kerja saya rapi dan bersih."}},{"q":"","o":{"D":"Saya suka tantangan.","I":"Saya suka suasana ramai.","S":"Saya suka suasana tenang.","C":"Saya suka suasana teratur."}}];
/* Shared by both pages: helpers, DISC block order and the answer code that travels
   from the candidate page to the admin dashboard inside a WhatsApp link. */

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const LS = {
  get(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch{ return null; } },
  set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch{} },
  del(k){ try{ localStorage.removeItem(k); }catch{} },
};

// Fixed per-block shuffle so the same letter is not always in the same spot.
function order(i){
  const a = ["D","I","S","C"]; let s = (i+1)*7919;
  for(let k=3;k>0;k--){ s = (s*9301+49297)%233280; const j = Math.floor(s/233280*(k+1)); [a[k],a[j]]=[a[j],a[k]]; }
  return a;
}

// One DISC answer (most, least) = one letter a-l.
const PAIR = "abcdefghijkl", DL = "DISC";
function encPair(m, l){ const mi = DL.indexOf(m), li = DL.indexOf(l); return PAIR[mi*3 + (li > mi ? li-1 : li)]; }
function decPair(ch){
  const x = PAIR.indexOf(ch); if(x < 0) return null;
  const mi = Math.floor(x/3), lj = x%3, li = lj >= mi ? lj+1 : lj;
  return {m:DL[mi], l:DL[li]};
}

const clean = s => (String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").trim().replace(/\s+/g,"_").replace(/[^A-Za-z0-9_]/g,"").slice(0,30)) || "~";
const unclean = s => s === "~" ? "" : String(s||"").replace(/_/g," ");
function checksum(s){ let h=0; for(const ch of s){ h = (h*31 + ch.charCodeAt(0)) >>> 0; } return (h % 1296).toString(36).padStart(2,"0"); }
const s36 = n => Math.max(0, Math.round(n||0)).toString(36);

// tp2.<id>.<name>.<age>.<origin>.<bio><scen><likert><disc>.<sjt s>.<likert s>.<disc s>.<total s>.<finished s>.<check>
function buildCode(c){
  const ans = c.bio.join("") + c.scen.join("") + c.lik.join("") + c.disc.map(a => encPair(a.m, a.l)).join("");
  const body = ["tp2", c.id, clean(c.name), clean(c.age), clean(c.origin), ans,
    s36(c.dur.sjt), s36(c.dur.lik), s36(c.dur.disc), s36((c.finishedAt - c.startedAt)/1000), s36(c.finishedAt/1000)].join(".");
  return body + "." + checksum(body);
}

// Returns a stored record, or null when the code is damaged. Also reads the first version (tp1).
function decodeCode(raw){
  try{
    const m = String(raw||"").match(/tp[12]\.[A-Za-z0-9._~-]+/); if(!m) return null;
    const parts = m[0].split(".");
    const v = parts[0] === "tp2" ? 2 : 1;
    const n = v === 2 ? 12 : 10;
    if(parts.length !== n) return null;
    if(checksum(parts.slice(0, n-1).join(".")) !== parts[n-1]) return null;
    const [, id, name, age, origin, ans] = parts;
    const num = i => parseInt(parts[i], 36);
    const discFrom = str => [...str].map(ch => { const p = decPair(ch); if(!p) throw new Error("bad"); return p; });
    const base = {id:"w"+id, name:unclean(name), age:unclean(age), origin:unclean(origin), notes:"", status:"Baru", source:"online"};

    if(v === 1){
      if(ans.length !== DISC.length + 10) return null;
      const disc = discFrom(ans.slice(0, DISC.length));
      const scen = [...ans.slice(DISC.length)].map(Number);
      if(scen.some(x => !(x >= 0 && x <= 3))) return null;
      const finishedAt = num(8)*1000, startedAt = finishedAt - num(7)*1000, discS = num(6);
      return {...base, v:1, bio:null, lik:null, disc, scen, startedAt, finishedAt, createdAt:finishedAt,
        dur:{disc:discS, sjt:Math.max(0, (finishedAt-startedAt)/1000 - discS), lik:0}};
    }

    const nb = BIO.length, ns = SCEN.length, nl = LIK.length;
    if(ans.length !== nb + ns + nl + DISC.length) return null;
    const digits = s => [...s].map(Number);
    const bio = digits(ans.slice(0, nb));
    const scen = digits(ans.slice(nb, nb+ns));
    const lik = digits(ans.slice(nb+ns, nb+ns+nl));
    const disc = discFrom(ans.slice(nb+ns+nl));
    if(bio.some((x,i) => !(x >= 0 && x < BIO[i].o.length))) return null;
    if(scen.some(x => !(x >= 0 && x <= 3))) return null;
    if(lik.some(x => !(x >= 1 && x <= 5))) return null;
    const finishedAt = num(10)*1000, startedAt = finishedAt - num(9)*1000;
    return {...base, v:2, bio, scen, lik, disc, startedAt, finishedAt, createdAt:finishedAt,
      dur:{sjt:num(6), lik:num(7), disc:num(8)}};
  }catch{ return null; }
}

/* ---------- Flow ---------- */
// Situations first while the candidate is fresh: they carry the most weight.
const FLOW = [
  {s:"welcome"},
  {s:"bio", n:BIO.length, part:0},
  {s:"intro1", part:1},
  {s:"sjt", n:SCEN.length, part:1},
  {s:"intro2", part:2},
  {s:"lik", n:LIK.length, part:2},
  {s:"intro3", part:3},
  {s:"disc", n:DISC.length, part:3},
  {s:"done"},
];
const TOTAL = BIO.length + SCEN.length + LIK.length + DISC.length;
const PART_NAME = ["Tentang kamu","Bagian 1 dari 3 · Cerita jaga anak","Bagian 2 dari 3 · Tentang diri kamu","Bagian 3 dari 3 · Gaya kerja"];
const KEY = "tp_kandidat_v2";

const params = new URLSearchParams(location.search);
const WA = (params.get("wa")||"").replace(/\D/g,"");
const LINK_NAME = (params.get("n")||"").trim().slice(0,40);

function fresh(){
  return {id:Math.random().toString(36).slice(2,8), linkName:LINK_NAME, name:LINK_NAME, age:"", origin:"",
    bio:Array(BIO.length).fill(null), scen:Array(SCEN.length).fill(null), lik:Array(LIK.length).fill(null), disc:Array(DISC.length).fill(null),
    t:{}, startedAt:null, finishedAt:null, stage:"welcome", i:0};
}
let C = LS.get(KEY);
const valid = C && Array.isArray(C.lik) && C.lik.length === LIK.length && Array.isArray(C.scen) && C.scen.length === SCEN.length
  && Array.isArray(C.bio) && C.bio.length === BIO.length && Array.isArray(C.disc) && C.disc.length === DISC.length && FLOW.some(f => f.s === C.stage);
// A link made for a different person starts a new test on this phone.
if(!valid || (LINK_NAME && C.linkName !== LINK_NAME)) C = fresh();
let resumed = C.stage !== "welcome" && C.stage !== "done";
let busy = false;
const save = () => LS.set(KEY, C);

const flowIdx = () => FLOW.findIndex(f => f.s === C.stage);
function answeredCount(){
  return C.bio.filter(x => x != null).length + C.scen.filter(x => x != null).length
    + C.lik.filter(x => x != null).length + C.disc.filter(x => x && x.m && x.l).length;
}
function markStart(){
  const f = FLOW[flowIdx()];
  if(f.n && !C.t[f.s+"0"]){ C.t[f.s+"0"] = Date.now(); if(!C.startedAt && f.s !== "bio") C.startedAt = Date.now(); }
}

/* ---------- Speech ---------- */
const canSpeak = (() => { try{ return "speechSynthesis" in window && typeof SpeechSynthesisUtterance !== "undefined"; }catch{ return false; } })();
function speak(text){
  try{
    const s = window.speechSynthesis; s.cancel();
    const u = new SpeechSynthesisUtterance(text); u.lang = "id-ID"; u.rate = 0.9;
    const v = s.getVoices().find(v => /^id/i.test(v.lang)); if(v) u.voice = v;
    s.speak(u);
  }catch{}
}
const stopSpeech = () => { try{ window.speechSynthesis?.cancel(); }catch{} };
const listen = text => canSpeak ? `<button class="listen" data-act="speak" data-text="${esc(text)}">${ICON.speak}Dengarkan</button>` : "";

/* ---------- Screens ---------- */
function bar(label, sayText){
  const pct = Math.round(answeredCount()/TOTAL*100);
  return `<div class="bar">
    <div class="bar-row"><div class="brand"><span class="mark">TP</span>${label ? `<span class="part">${esc(label)}</span>` : "Tes Calon Pengasuh"}</div>${sayText ? listen(sayText) : ""}</div>
    ${C.stage !== "welcome" ? `<div class="progress" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100" aria-label="Kemajuan tes"><span style="width:${pct}%"></span></div>` : ""}
  </div>`;
}
const backBtn = () => `<button class="btn ghost" data-act="back" aria-label="Kembali ke soal sebelumnya">Kembali</button>`;

const SCREENS = {welcome, bio:bioScreen, intro1, sjt:sjtScreen, intro2, lik:likScreen, intro3, disc:discScreen, done:doneScreen};
function render(){
  if(C.stage === "done" && (firstMissing() || !C.dur)){ const m = firstMissing(); if(m){ C.stage = m.s; C.i = m.i; } else finish(); }
  markStart();
  $app.innerHTML = SCREENS[C.stage]();
  resumed = false;
}
function show(){ stopSpeech(); save(); render(); window.scrollTo(0, 0); busy = false; }

// First unanswered item, if any (guards against a half-filled saved state).
function firstMissing(){
  for(const [s, arr] of [["bio",C.bio],["sjt",C.scen],["lik",C.lik],["disc",C.disc]]){
    const i = arr.findIndex(x => x == null || (s === "disc" && !(x.m && x.l)));
    if(i >= 0) return {s, i};
  }
  return null;
}
function finish(){
  const span = s => { const a = C.t[s+"0"], b = C.t[s+"1"]; return a && b && b > a ? (b - a)/1000 : 0; };
  C.dur = {sjt:span("sjt"), lik:span("lik"), disc:span("disc")};
  C.finishedAt = C.finishedAt || Date.now();
  C.startedAt = C.startedAt || C.t.sjt0 || C.finishedAt;
}
function next(){
  const f = FLOW[flowIdx()];
  if(f.n){ C.t[f.s+"1"] = Date.now(); if(C.i < f.n - 1){ C.i++; return show(); } }
  const nf = FLOW[flowIdx() + 1]; if(!nf) return;
  if(nf.s === "done"){
    const miss = firstMissing();
    if(miss){ C.stage = miss.s; C.i = miss.i; return show(); }
    finish();
  }
  C.stage = nf.s; C.i = 0;
  show();
}
function back(){
  const f = FLOW[flowIdx()];
  if(f.n && C.i > 0){ C.i--; return show(); }
  const pf = FLOW[flowIdx() - 1];
  if(!pf || C.stage === "done") return;
  C.stage = pf.s; C.i = pf.n ? pf.n - 1 : 0; show();
}
// Answer, show the selection briefly, then move on.
function answerThen(fn){ if(busy) return; busy = true; fn(); save(); render(); setTimeout(next, 320); }

/* ---------- Actions ---------- */
const act = {
  speak: ds => speak(ds.text),
  next(){ if(!busy) next(); },
  back(){ if(!busy) back(); },
  bio: ds => answerThen(() => { C.bio[C.i] = +ds.k; }),
  sjt: ds => answerThen(() => { C.scen[C.i] = +ds.k; }),
  lik: ds => answerThen(() => { C.lik[C.i] = +ds.k + 1; }),
  pick(ds){
    if(busy) return;
    const k = ds.k, cur = Object.assign({m:null, l:null}, C.disc[C.i] || {});
    if(cur.m === k) cur.m = null; else if(cur.l === k) cur.l = null; else if(!cur.m) cur.m = k; else if(!cur.l) cur.l = k; else return;
    const wasDone = !!(C.disc[C.i]?.m && C.disc[C.i]?.l);
    C.disc[C.i] = cur; save(); render();
    if(cur.m && cur.l && !wasDone){ busy = true; setTimeout(() => { busy = false; next(); }, 650); }
  },
  async copy(){
    const ta = document.getElementById("msg");
    try{ await navigator.clipboard.writeText(ta.value); }catch{ ta.select(); try{ document.execCommand("copy"); }catch{} }
    document.getElementById("copied").hidden = false;
  },
};

$app.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if(!b || b.disabled) return;
  act[b.dataset.act]?.(b.dataset);
});
$app.addEventListener("submit", e => {
  if(e.target.id !== "startForm") return;
  e.preventDefault();
  const name = document.getElementById("f-name").value.trim();
  const age = document.getElementById("f-age").value.replace(/\D/g,"");
  const origin = document.getElementById("f-origin").value.trim();
  const err = document.getElementById("formErr");
  if(!name){ err.textContent = "Tulis nama kamu dulu."; err.hidden = false; return; }
  if(age && (+age < 15 || +age > 80)){ err.textContent = "Umur sepertinya salah. Coba cek lagi."; err.hidden = false; return; }
  C.name = name; C.age = age; C.origin = origin;
  next();
});

/* tests and the owner preview read these */
window.__tp = {get state(){ return C; }, reset(){ C = fresh(); show(); }};
render();
</script>
</body>
</html>
